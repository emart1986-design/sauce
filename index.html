<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios Ómnibus 11a y 6a</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
    }

    html, body {
      width: 100%;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .header {
      padding: 8px 0;
      margin-bottom: 12px;
    }

    .day-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 2px;
    }

    .current-time {
      font-size: 28px;
      font-weight: 600;
      color: #000;
    }

    .route-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .route-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #f9f9f9;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .route-btn:active {
      transform: scale(0.98);
    }

    .route-btn.active {
      background: #378add;
      color: white;
      border-color: #378add;
    }

    .buses-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .bus-column {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bus-column.amber {
      background: #fff8e1;
      border-color: #ffd54f;
    }

    .bus-column.blue {
      background: #e3f2fd;
      border-color: #64b5f6;
    }

    .column-header {
      padding: 8px 2px;
      border-bottom: 1px solid currentColor;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      line-height: 1;
    }

    .bus-column.amber .column-header {
      background: rgba(255, 193, 7, 0.2);
      color: #ba7517;
      border-color: #ffd54f;
    }

    .bus-column.blue .column-header {
      background: rgba(55, 138, 221, 0.2);
      color: #1565c0;
      border-color: #64b5f6;
    }

    .schedule-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .schedule-item {
      padding: 8px 2px;
      border-bottom: 0.5px solid currentColor;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .schedule-item:last-child {
      border-bottom: none;
    }

    .bus-column.amber .schedule-item {
      color: #6d4c0b;
      border-color: #ffd54f;
    }

    .bus-column.blue .schedule-item {
      color: #003d82;
      border-color: #64b5f6;
    }

    .schedule-item.next {
      background: #d4a000;
      color: #ffffff;
      font-weight: 900;
      padding: 8px 2px;
      font-size: 20px;
    }
    
    .bus-column.blue .schedule-item.next {
      background: #0d47a1;
      color: #fff;
    }

    .schedule-item.passed {
      font-size: 15px;
      opacity: 0.4;
    }

    .schedule-item.special {
      background: rgba(76, 175, 80, 0.2);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="day-info" id="dayInfo"></div>
      <div class="current-time" id="currentTime"></div>
    </div>
    
    <div class="route-tabs">
      <button class="route-btn active" data-route="ida" onclick="switchRoute('ida')">Ida a MVDEO</button>
      <button class="route-btn" data-route="sauce" onclick="switchRoute('sauce')">Ida a SAUCE</button>
    </div>
    
    <div class="buses-comparison">
      <div class="bus-column amber">
        <div class="column-header">11a</div>
        <ul class="schedule-list" id="scheduleColumn11a"></ul>
      </div>
      
      <div class="bus-column blue">
        <div class="column-header">6a</div>
        <ul class="schedule-list" id="scheduleColumn6a"></ul>
      </div>
    </div>
  </div>

  <script>
    const schedules = {
      'weekday': {
        '11a-ida': ['03:45', '04:15', '04:50', '05:15', '05:32', '05:50', '06:10', '06:18', '06:25', '06:43', '07:03', '07:10', '07:26', '07:40', '07:50', '08:05', '08:10', '08:40', '09:05', '09:40', '09:45', '10:05', '10:35', '10:55', '11:10', '11:30', '12:00', '12:10', '12:30', '12:45', '13:00', '13:10', '13:30', '13:55', '14:26', '14:45', '14:55', '15:00', '15:20', '15:40', '16:00', '16:15', '16:40', '17:00', '17:15', '17:35', '18:15', '18:30', '19:00', '19:20', '19:45', '20:10', '20:45', '21:30', '22:20', '23:25', '00:50'],
        '11a-sauce': ['04:55', '05:40', '06:45', '07:30', '08:15', '09:00', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '14:55', '15:43', '16:05', '16:43', '17:20', '17:45', '18:20', '19:00', '19:50', '20:30', '21:25', '21:55', '22:50', '23:59'],
        '6a-ida': ['06:00', '07:00', '08:20', '09:20', '10:25', '11:15', '11:40', '12:30', '13:25', '14:20', '15:10', '15:35', '16:10', '16:50', '17:20', '17:55', '18:35', '19:10', '20:00', '20:55', '21:45', '22:40', '23:45'],
        '6a-sauce': ['04:20', '05:20', '05:55', '06:20', '06:40', '07:20', '07:45', '08:15', '09:10', '10:05', '10:55', '11:45', '12:45', '13:30', '14:15', '15:00', '15:45', '16:45', '17:10', '18:00', '18:45', '19:20', '20:45', '22:15']
      },
      'saturday': {
        '11a-ida': ['04:00', '05:00', '05:50', '06:15', '06:58', '07:35', '08:05', '08:35', '09:10', '09:50', '10:00', '10:25', '10:47', '11:15', '11:45', '13:05', '14:05', '14:35', '15:00', '15:45', '16:20', '17:15', '18:35', '18:50', '19:30', '20:20', '21:10', '22:20', '23:25'],
        '11a-sauce': ['04:55', '05:40', '06:45', '07:30', '08:15', '09:00', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '14:55', '15:43', '16:05', '16:43', '17:20', '17:45', '18:20', '19:00', '19:50', '20:30', '21:25', '21:55', '22:50', '23:59'],
        '6a-ida': ['06:15', '08:00', '09:20', '10:55', '11:50', '12:55', '14:10', '15:30', '16:35', '18:15', '19:40', '21:00', '22:20', '23:10'],
        '6a-sauce': ['04:30', '06:15', '07:25', '08:30', '09:50', '11:00', '12:25', '13:30', '14:25', '16:00', '17:15', '19:00', '20:00', '21:30']
      },
      'sunday': {
        '11a-ida': ['04:19', '05:00', '05:50', '06:40', '07:50', '08:35', '09:10', '09:50', '10:05', '11:00', '12:10', '13:10', '14:20', '15:40', '16:30', '17:30', '18:35', '19:00', '19:45', '21:15', '22:20', '23:10'],
        '11a-sauce': ['05:00', '05:55', '06:45', '08:00', '09:25', '10:45', '11:20', '12:03', '13:05', '14:00', '14:50', '16:15', '17:45', '18:10', '19:30', '20:15', '20:55', '22:00', '23:00', '23:59'],
        '6a-ida': ['06:15', '08:30', '10:25', '12:00', '14:30', '16:30', '18:05', '20:20', '22:15'],
        '6a-sauce': ['04:30', '06:35', '08:45', '10:20', '12:35', '14:30', '16:35', '18:30', '20:35']
      }
    };

    const specialHours = {
      '6a-sauce': ['06:40', '09:10'],
      '6a-ida': ['16:50']
    };

    let currentRoute = 'ida';

    function getScheduleType(date) {
      const day = date.getDay();
      if (day === 0) return 'sunday';
      if (day === 6) return 'saturday';
      return 'weekday';
    }

    function getDayName(date) {
      const days = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      return days[date.getDay()];
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function switchRoute(route) {
      currentRoute = route;
      document.querySelectorAll('.route-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-route="${route}"]`).classList.add('active');
      updateDisplay();
    }

    function renderSchedule(times, elementId, currentMinutes, specialList) {
      const list = document.getElementById(elementId);
      list.innerHTML = '';
      
      let nextFound = false;
      const lastTime = times[times.length - 1];
      
      times.forEach(time => {
        const minutes = timeToMinutes(time);
        const li = document.createElement('li');
        li.className = 'schedule-item';
        li.textContent = time;
        
        if (specialList && specialList.includes(time)) {
          li.classList.add('special');
        }
        
        if (time === lastTime) {
          li.classList.add('special');
        }
        
        if (!nextFound && minutes > currentMinutes) {
          li.classList.add('next');
          nextFound = true;
        } else if (minutes <= currentMinutes) {
          li.classList.add('passed');
        }
        
        list.appendChild(li);
      });
    }

    function updateDisplay() {
      const now = new Date();
      const scheduleType = getScheduleType(now);
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      
      const timeStr = now.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('currentTime').textContent = timeStr;
      
      const dayName = getDayName(now);
      const dayTypeText = scheduleType === 'weekday' ? '(Entre semana)' : 
                          scheduleType === 'saturday' ? '(Sábado)' : '(Domingo)';
      document.getElementById('dayInfo').textContent = `${dayName} ${dayTypeText}`;
      
      const current = schedules[scheduleType];
      const suffix = currentRoute === 'ida' ? '-ida' : '-sauce';
      
      const times11a = current[`11a${suffix}`];
      const times6a = current[`6a${suffix}`];
      
      const specialList6a = specialHours[`6a${suffix}`] || [];
      
      renderSchedule(times11a, 'scheduleColumn11a', currentMinutes, null);
      renderSchedule(times6a, 'scheduleColumn6a', currentMinutes, specialList6a);
    }

    updateDisplay();
    setInterval(updateDisplay, 30000);
  </script>
</body>
</html>
