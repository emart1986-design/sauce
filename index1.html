<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="App de horarios en tiempo real para las líneas 11a (UCOT) y 6a (Casanova) entre Sauce y Montevideo.">
  <meta name="theme-color" content="#378add">
  
  <title>Horarios Ómnibus 11a y 6a</title>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Header con hora y día -->
    <div class="header">
      <div class="day-info" id="dayInfo"></div>
      <div class="current-time" id="currentTime"></div>
    </div>
    
    <!-- Botones de ruta -->
    <div class="route-tabs">
      <button class="route-btn active" data-route="ida" onclick="switchRoute('ida')">
        Ida a MVDEO
      </button>
      <button class="route-btn" data-route="sauce" onclick="switchRoute('sauce')">
        Ida a SAUCE
      </button>
    </div>
    
    <!-- Grid de horarios -->
    <div class="buses-comparison">
      <!-- Línea 11a (Amarilla) -->
      <div class="bus-column amber">
        <div class="column-header">11a</div>
        <ul class="schedule-list" id="scheduleColumn11a"></ul>
      </div>
      
      <!-- Línea 6a (Azul) -->
      <div class="bus-column blue">
        <div class="column-header">6a</div>
        <ul class="schedule-list" id="scheduleColumn6a"></ul>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
